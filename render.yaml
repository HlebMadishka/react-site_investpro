services:
  - type: web
    name: investpro
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: investpro-db
          property: connectionString
      - key: NODE_VERSION
        value: 22

databases:
  - name: investpro-db
    plan: free
    databaseName: investpro
    user: investpro
