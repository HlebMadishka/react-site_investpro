services:
  - type: web
    name: investpro
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: investpro-db
          property: connectionString
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: admin123456
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: investpro-db
    plan: free
    databaseName: investpro
    user: investpro
